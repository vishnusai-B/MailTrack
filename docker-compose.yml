services:
  postgres:
    image: postgres:16-alpine
    container_name: mailtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailtrack
      POSTGRES_PASSWORD: mailtrack_dev_password
      POSTGRES_DB: mailtrack
    ports:
      - '5432:5432'
    volumes:
      - mailtrack_pgdata:/var/lib/postgresql/data

volumes:
  mailtrack_pgdata:
